<svg viewBox="0 0 680 500" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
<title>二维码批量排版打印工具工作原理</title>
<desc>展示从多个二维码图片输入，经浏览器本地处理，生成每张铺满 A4 的输出图片，并打包为 ZIP 的完整流程。</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect width="680" height="500" fill="#ffffff"/>

<text x="40" y="30" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">批量二维码 A4 排版工具 · 工作流程</text>

<g>
  <rect x="40" y="56" width="112" height="86" rx="10" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="96" y="76" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#0C447C" text-anchor="middle" dominant-baseline="central">输入</text>
  <text x="96" y="98" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">多个二维码</text>
  <text x="96" y="116" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#185FA5" text-anchor="middle" dominant-baseline="central">图片 / 文件夹</text>
</g>

<line x1="152" y1="99" x2="192" y2="99" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="192" y="56" width="112" height="86" rx="10" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text x="248" y="76" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#3C3489" text-anchor="middle" dominant-baseline="central">浏览器本地</text>
  <text x="248" y="98" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">自动排版 + 绘制</text>
  <text x="248" y="116" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#534AB7" text-anchor="middle" dominant-baseline="central">不上传、不联网</text>
</g>

<line x1="304" y1="99" x2="344" y2="99" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="344" y="56" width="112" height="86" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="400" y="76" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#085041" text-anchor="middle" dominant-baseline="central">每张原图 →</text>
  <text x="400" y="98" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">1 张 A4 铺满图</text>
  <text x="400" y="116" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#0F6E56" text-anchor="middle" dominant-baseline="central">300 DPI PNG</text>
</g>

<line x1="456" y1="99" x2="496" y2="99" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

<g>
  <rect x="496" y="56" width="144" height="86" rx="10" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text x="568" y="76" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="13" font-weight="500" fill="#633806" text-anchor="middle" dominant-baseline="central">打包下载</text>
  <text x="568" y="98" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">自动压缩为 ZIP</text>
  <text x="568" y="116" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="12" fill="#854F0B" text-anchor="middle" dominant-baseline="central">按文件夹分组</text>
</g>

<text x="40" y="182" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">A4 版面结构（21 × 29.7 cm）</text>

<rect x="248" y="200" width="170" height="240" rx="4" fill="#FFFFFF" stroke="#B4B2A9" stroke-width="0.5"/>
<rect x="262" y="214" width="142" height="212" rx="2" fill="none" stroke="#D3D1C7" stroke-width="0.5" stroke-dasharray="4 3"/>

<text x="333" y="228" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">门店A · 标题</text>

<rect x="283" y="244" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="320" y="244" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="357" y="244" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="283" y="281" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="320" y="281" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="357" y="281" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="283" y="318" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="320" y="318" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="357" y="318" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="283" y="355" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="320" y="355" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="357" y="355" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="283" y="392" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="320" y="392" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
<rect x="357" y="392" width="26" height="26" rx="3" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>

<line x1="248" y1="228" x2="196" y2="228" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="192" y="228" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">标题距上边缘 0.6cm</text>

<line x1="283" y1="244" x2="228" y2="257" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="224" y="257" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">标题下 0.5cm 起排</text>

<line x1="348" y1="283" x2="420" y2="283" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="424" y="283" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A" dominant-baseline="central">二维码 3×3cm</text>

<line x1="383" y1="276" x2="452" y2="330" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="456" y="330" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A" dominant-baseline="central">间距 0.5cm</text>

<line x1="262" y1="440" x2="228" y2="440" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="224" y="440" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A" text-anchor="end" dominant-baseline="central">四周 1cm 安全边距</text>

<line x1="418" y1="330" x2="452" y2="380" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="456" y="380" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A" dominant-baseline="central">默认 5 列 × 7 行</text>
<text x="456" y="398" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#5F5E5A" dominant-baseline="central">每页 35 个</text>

<text x="40" y="478" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif" font-size="11" fill="#888780">参数改动后每页数量自动重算，预览实时刷新</text>
</svg>
